name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline suite
        run: python -m pytest . -m "not live"
      - name: Lint
        run: ruff check .

  research-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install research, CPU battery and dashboard dependencies
        run: python -m pip install -r requirements-research.txt -r requirements-battery.txt -r requirements-dashboard.txt
      - name: Verify CPU-only torch
        run: python -c "import torch; assert torch.version.cuda is None"
      - name: Run full offline suite with no skipped tests
        run: |
          python -m pytest . -m "not live" --junitxml=research-results.xml
          python -c "import xml.etree.ElementTree as E; root=E.parse('research-results.xml').getroot(); skipped=sum(int(s.get('skipped', 0)) for s in root.iter('testsuite')); assert skipped == 0, f'{skipped} tests skipped'"
      - name: Lint
        run: ruff check .
